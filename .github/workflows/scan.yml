name: RTMP Live Stream Brute Force Scanner

on:
  workflow_dispatch: # 支援在 GitHub 網頁端手動點擊按鈕執行

jobs:
  scan_and_save:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Network Discovery Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Run Brute Force Scanner
      run: python scan.py

    - name: Commit and Push valid_rtmp.txt
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # 檢查是否有產出有效檔案，若有則提交
        if [ -f valid_rtmp.txt ]; then
          git add valid_rtmp.txt
          git commit -m "自动更新: 提取出最新存活的盲测 RTMP 頻道" || echo "名單無變化，跳過提交"
          git push
        fi
