name: RTMP Live Stream Brute Force Scanner

on:
  workflow_dispatch: # 支援在 GitHub 網頁端手動點擊按鈕執行

jobs:
  scan_and_save:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Network Discovery Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Run Brute Force Scanner
      run: python scan.py

    - name: Commit and Push valid_rtmp Files
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # 強制添加生成的 txt 與 m3u 檔案（若有變動）
        git add valid_rtmp.txt valid_rtmp.m3u || true
        
        # 執行提交，若檔案無變化則優雅跳過不報錯
        git commit -m "自动更新: 提取出最新存活的盲测 RTMP 频道 (TXT & M3U)" || echo "名单无变化，跳过提交"
        git push
