name: Auto Scan IPTV Channels

on:
  schedule:
    # 每天北京时间早上 8:00 自动运行一次 (UTC 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # 允许你在 GitHub 页面上手动点击按钮触发运行

jobs:
  scan_and_update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # 必须安装 cloudscraper 才能配合新的 scanner.py 绕过 Cloudflare 防御
        pip install cloudscraper

    - name: Run Scanner Script
      run: python scanner.py

    - name: Commit and Push M3U File
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # 检查 live.m3u 文件是否有变动，避免无意义的重复提交
        if [ -n "$(git status --porcelain live.m3u)" ]; then
          git add live.m3u
          git commit -m "自动更新：通过 Cloudscraper 清洗最新有效四季源"
          git push
        else
          echo "直播源链接无变动，跳过本次提交。"
        fi
